name: jungle-wallet
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: jungle_admin
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: jungle
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jungle_admin -d jungle"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-58080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-58080}:8080"]
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
  broker:
    image: ghcr.io/ministackorg/ministack:1.5.17
    environment:
      AUTH: "true"
      AWS_ACCESS_KEY_ID: jungle-local-root
      AWS_SECRET_ACCESS_KEY: jungle-local-root-secret
      AWS_DEFAULT_REGION: us-east-1
      LOG_LEVEL: WARNING
      PERSIST_STATE: "1"
      STATE_DIR: /state
    ports: ["127.0.0.1:${SQS_PORT:-54566}:4566"]
    volumes:
      - broker-data:/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  broker-init:
    image: ghcr.io/ministackorg/ministack:1.5.17
    entrypoint: [python, /bootstrap/bootstrap.py]
    environment:
      AWS_ENDPOINT_URL: http://broker:4566
      AWS_ACCESS_KEY_ID: jungle-local-root
      AWS_SECRET_ACCESS_KEY: jungle-local-root-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/ministack:/bootstrap:ro
      - broker-credentials:/credentials
    depends_on:
      broker: {condition: service_healthy}
  migrate:
    build: .
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://jungle_admin:local-admin-only@postgres:5432/jungle?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  app:
    build: .
    command: [server]
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://jungle_app:local-app-only@postgres:5432/jungle?sslmode=disable
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-58080}/realms/jungle
      OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
      OIDC_AUDIENCE: jungle-wallet
      SQS_ENDPOINT: http://broker:4566
      BROKER_CREDENTIALS_FILE: /run/broker/worker.json
    ports: ["127.0.0.1::8080"]
    volumes:
      - broker-credentials:/run/broker:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      broker-init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  broker-credentials:
  broker-data:
